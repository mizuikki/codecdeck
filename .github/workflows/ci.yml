name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            appstream \
            ca-certificates \
            cmake \
            desktop-file-utils \
            dpkg-dev \
            extra-cmake-modules \
            file \
            g++ \
            git \
            libpipewire-0.3-dev \
            libxml2-utils \
            ninja-build \
            pkg-config \
            qml6-module-org-kde-kirigami \
            qml6-module-qtquick-controls \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Validate install tree and Debian package
        run: |
          stage="/tmp/codecdeck-stage-${GITHUB_RUN_ID}"
          package_dir="/tmp/codecdeck-package-${GITHUB_RUN_ID}"
          mkdir -p "$stage" "$package_dir"
          DESTDIR="$stage" cmake --install build --prefix /usr --component Application
          DESTDIR="$stage" cmake --install build --prefix /usr --component PrivilegedHelper
          test -x "$stage/usr/bin/codecdeck"
          test -x "$stage/usr/libexec/codecdeck-helper"
          test -f "$stage/usr/share/icons/hicolor/512x512/apps/io.github.mizuikki.CodecDeck.png"
          cpack --config build/CPackConfig.cmake -B "$package_dir"
          dpkg-deb --info "$package_dir"/*.deb

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate QML
        run: /usr/lib/qt6/bin/qmllint -I build qml/Main.qml

      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net data/io.github.mizuikki.CodecDeck.metainfo.xml
          desktop-file-validate data/io.github.mizuikki.CodecDeck.desktop
          xmllint --noout data/io.github.mizuikki.codecdeck.policy.in
